name: Sprawdź district_id

on:
  schedule:
    - cron: '0 4 1 * *'  # 1. dnia każdego miesiąca o 4:00 UTC
  workflow_dispatch:        # możliwość ręcznego uruchomienia

jobs:
  check:
    runs-on: self-hosted
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Push commita i tagu musi faktycznie używać PAT-u. Domyślny
          # GITHUB_TOKEN nie wyzwala kolejnego workflow po git push.
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install requests beautifulsoup4 curl_cffi

      - name: Pobierz district_id z OLX i porównaj
        id: update
        run: |
          set +e
          python update_districts.py
          EXIT=$?
          set -e
          if [ $EXIT -eq 0 ]; then
            echo "CHANGED=false" >> "$GITHUB_ENV"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ $EXIT -eq 1 ]; then
            echo "CHANGED=true" >> "$GITHUB_ENV"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ $EXIT -eq 2 ]; then
            # Blokada OLX jest przejściowa i niezależna od repo — ostrzeżenie zamiast czerwieni.
            echo "CHANGED=false" >> "$GITHUB_ENV"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OLX zablokował runnera (403) — pominięto aktualizację district_id. Kolejna próba w następnym przebiegu."
          else
            echo "::error::update_districts.py zakończył się błędem (kod $EXIT)."
            exit 1
          fi

      - name: Commit i bump tagu
        if: env.CHANGED == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add olx_scraper.py README.md
          git commit -m "auto: aktualizacja district_id i README"

          # Pobierz ostatni tag ze zdalnego repozytorium (nie lokalnego)
          LAST=$(git ls-remote --tags origin | grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's|refs/tags/||' | sort -V | tail -1)
          if [ -z "$LAST" ]; then
            NEW="v1.0.1"
          else
            v1=$(echo "$LAST" | cut -d. -f1 | sed 's/v//')
            v2=$(echo "$LAST" | cut -d. -f2)
            v3=$(echo "$LAST" | cut -d. -f3)
            while true; do
              v3=$((v3 + 1))
              NEW="v${v1}.${v2}.${v3}"
              # Sprawdź czy tag już istnieje zdalnie
              if git ls-remote --tags origin | grep -q "refs/tags/$NEW$"; then
                continue
              else
                break
              fi
            done
          fi

          echo "Stary tag: $LAST  →  Nowy tag: $NEW"

          git push
          git tag "$NEW"
          git push origin "$NEW"
          # Nowy tag wyzwoli release.yml który zbuduje binarke
          # PAT_TOKEN wymagany — GITHUB_TOKEN nie wyzwala innych workflow

  sync-dev:
    name: Przestaw dev na main
    needs: [check]
    if: needs.check.outputs.changed == 'true'
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      # Osobny checkout zapisuje GITHUB_TOKEN zamiast PAT-u. Push synchronizujący
      # dev nie uruchamia dzięki temu kolejnego łańcucha workflow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: bash scripts/sync_dev_with_main.sh
